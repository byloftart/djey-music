<!DOCTYPE html>\n<!-- Approved owner-admin catalog prototype. Superdesign draft: b3a7732f-f4cc-467e-aae8-d85a657bb9f0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    @view-transition { navigation: auto; }

    :root {
      --page: #e8edf2;
      --shell: #ebf0f6;
      --surface-raised: #e8edf4;
      --surface-control: #e7ecf3;
      --ink: #26344b;
      --muted: #61708a;
      --shadow-dark: #c4ccd7;
      --shadow-light: #ffffff;
      --accent: #5d76ef;
      --accent-bright: #62dce8;
      --glow: rgba(87, 127, 241, 0.22);
      --display-start: #dce7e8;
      --display-end: #eff6f5;
      --display-ink: #24474f;
      --danger: #ef4444;
      --vh: 100vh;
    }

    .theme-dark-amber {
      --page: #171513;
      --shell: #211f1d;
      --surface-raised: #28231f;
      --surface-control: #191715;
      --ink: #f0e8dd;
      --muted: #b5a48f;
      --shadow-dark: #0e0d0c;
      --shadow-light: #37322d;
      --accent: #e97922;
      --accent-bright: #ffc45e;
      --glow: rgba(246, 123, 31, 0.28);
      --display-start: #21140b;
      --display-end: #332012;
      --display-ink: #ffc064;
      --danger: #ff5e5e;
    }

    body {
      font-family: 'Inter', ui-sans-serif, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--shadow-dark);
    }

    .admin-container {
      width: 100%;
      max-width: 430px;
      height: 100svh;
      height: 100dvh;
      height: var(--vh, 100dvh);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: var(--page);
    }

    .neomorph-raised {
      background: var(--surface-raised);
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    }

    .neomorph-inset {
      background: var(--surface-control);
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    .neomorph-button {
      background: var(--surface-control);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      color: var(--ink);
    }

    .neomorph-button:active {
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
      transform: scale(0.98);
    }

    .display-readout {
      background: linear-gradient(145deg, var(--display-start), var(--display-end));
      color: var(--display-ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.05);
      border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent);
    }

    .accent-glow {
      box-shadow: 0 0 15px var(--glow);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--shadow-dark);
      border-radius: 10px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      flex-shrink: 0;
    }
    
    .status-published {
      background-color: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .status-draft {
      background-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .theme-dark-amber .status-published {
      background-color: #4ade80;
    }

    .theme-dark-amber .status-draft {
      background-color: #f87171;
    }

    .track-row, .track-row * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .track-row {
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .sorting-active, .sorting-active * {
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    .sortable-chosen {
      z-index: 50;
      transform: scale(1.02);
      box-shadow: 0 10px 25px var(--shadow-dark), 0 0 15px var(--glow) !important;
      opacity: 1 !important;
      will-change: transform;
    }

    .sortable-ghost {
      background: transparent !important;
      border: 2px dashed var(--accent) !important;
      box-shadow: none !important;
      opacity: 0.4;
    }

    .sortable-drag, .sortable-fallback {
      opacity: 1 !important;
      z-index: 100 !important;
      pointer-events: none !important;
      transform: translateZ(0);
      will-change: transform;
      border-radius: 18px !important;
      box-shadow: 0 15px 30px var(--shadow-dark), 0 0 20px var(--glow) !important;
    }

    .toast-notification {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface-raised);
      border: 1px solid var(--accent);
      box-shadow: 0 4px 12px var(--shadow-dark), 0 0 8px var(--glow);
      padding: 8px 16px;
      border-radius: 12px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      z-index: 100;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .toast-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .track-row-dragging {
      z-index: 50;
      transform: scale(1.02);
      box-shadow: 0 15px 30px var(--shadow-dark), 0 0 20px var(--glow);
      opacity: 0.95;
      pointer-events: none;
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      width: calc(100% - 32px);
      margin: 0 16px;
    }

    .track-row-placeholder {
      background: transparent !important;
      border: 2px dashed var(--shadow-dark);
      box-shadow: none !important;
    }

    .menu-popover {
      animation: popover-in 0.15s cubic-bezier(0, 0, 0.2, 1);
      display: none;
      background: var(--surface-raised);
    }

    .menu-popover.open {
      display: block;
    }

    @keyframes popover-in {
      from { opacity: 0; transform: translateY(-10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #track-list {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <div class="flex items-center justify-center overflow-hidden">
    <div id="root-container" class="admin-container">
      
      <!-- Header -->
      <header class="shrink-0 pt-7 px-6 pb-6 relative">
        <div class="neomorph-raised rounded-[28px] p-5 flex flex-col items-center relative">
          <!-- Account -->
          <div class="absolute left-4 top-1/2 -translate-y-1/2">
            <button id="btn-account" class="w-11 h-11 neomorph-button rounded-full flex items-center justify-center" title="Account">
              <iconify-icon icon="lucide:user" class="text-xl text-[var(--accent)]"></iconify-icon>
            </button>
            <div id="account-popover" class="menu-popover absolute left-0 top-full mt-3 w-32 neomorph-raised rounded-[18px] p-2 z-50">
              <button id="btn-logout" class="w-full h-11 px-4 flex items-center gap-2 hover:bg-[var(--accent)]/10 rounded-xl transition-colors">
                <iconify-icon icon="lucide:log-out" class="text-sm text-[var(--danger)]"></iconify-icon>
                <span class="text-[13px] font-bold text-[var(--ink)]">Sign Out</span>
              </button>
            </div>
          </div>
          
          <!-- Brand -->
          <div class="text-center">
            <h1 class="text-[22px] font-black tracking-[0.2em] uppercase leading-none text-[var(--ink)]">DJey <span class="text-[var(--accent)]">Music</span></h1>
            <span class="text-[11px] font-bold text-[var(--muted)] tracking-[0.25em] uppercase mt-1.5 block">Admin Panel</span>
          </div>

          <!-- Theme -->
          <button id="btn-theme-toggle" class="absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 neomorph-button rounded-full flex items-center justify-center">
            <iconify-icon icon="lucide:moon" class="text-xl"></iconify-icon>
          </button>
        </div>
      </header>

      <!-- Main -->
      <main class="flex-1 flex flex-col px-4 min-h-0 overflow-hidden">
        <div class="flex-1 neomorph-inset rounded-[36px] flex flex-col min-h-0 overflow-hidden">
          <div class="px-6 py-5 flex items-center gap-3 shrink-0">
            <div class="display-readout rounded-xl px-3 py-2 flex items-center justify-center gap-2 flex-1 h-[38px] whitespace-nowrap overflow-hidden">
              <iconify-icon icon="lucide:list-music" class="text-[15px]"></iconify-icon>
              <span id="track-count" class="text-[11px] font-bold uppercase tracking-[0.01em]">48 TRACKS TOTAL</span>
            </div>

            <!-- Filter -->
            <div class="relative flex-1">
              <button id="btn-filter" class="w-full display-readout rounded-xl px-3 py-2 flex items-center justify-center gap-2 h-[38px] whitespace-nowrap overflow-hidden">
                <iconify-icon icon="lucide:filter" class="text-[15px]"></iconify-icon>
                <span id="current-filter-label" class="text-[11px] font-bold uppercase tracking-[0.01em]">All Tracks</span>
                <iconify-icon icon="lucide:chevron-down" class="text-[15px]"></iconify-icon>
              </button>
              <div id="filter-popover" class="menu-popover absolute right-0 top-full mt-2 w-40 neomorph-raised rounded-[20px] p-2 z-50">
                <button data-filter="all" id="filter-all-btn" class="filter-option w-full h-10 px-4 flex items-center text-[12px] font-bold uppercase text-[var(--ink)] hover:bg-[var(--accent)]/10 rounded-xl">All Tracks</button>
                <button data-filter="published" id="filter-published-btn" class="filter-option w-full h-10 px-4 flex items-center text-[12px] font-bold uppercase text-[var(--ink)] hover:bg-[var(--accent)]/10 rounded-xl">Published</button>
                <button data-filter="draft" id="filter-draft-btn" class="filter-option w-full h-10 px-4 flex items-center text-[12px] font-bold uppercase text-[var(--ink)] hover:bg-[var(--accent)]/10 rounded-xl">Drafts</button>
              </div>
            </div>
          </div>

          <div class="flex-1 min-h-0 overflow-hidden px-4 pb-4">
            <div class="h-full neomorph-inset rounded-[28px] overflow-hidden flex flex-col">
              <div id="track-list" class="flex-1 overflow-y-auto custom-scrollbar px-3 pt-3 pb-3 space-y-2 relative">
                <!-- Prototype Rows Generated by Script -->
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Dock -->
      <footer class="shrink-0 px-6 pt-3 pb-[max(12px,env(safe-area-inset-bottom))] relative">
      <div id="toast-reorder" class="toast-notification">Order updated</div>
        <div class="neomorph-raised rounded-[32px] p-4 flex items-center">
          <button id="cta-add-track" class="w-full h-14 bg-[var(--accent)] rounded-[20px] flex items-center justify-center gap-3 active:scale-[0.97] transition-all accent-glow border border-[var(--accent-bright)]/20">
            <iconify-icon icon="lucide:plus" class="text-white text-xl"></iconify-icon>
            <span class="text-white text-[15px] font-bold uppercase tracking-wider">Add Track</span>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    // Viewport Handling for Mobile Browsers
    const updateVh = () => {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    };
    if (window.visualViewport) window.visualViewport.addEventListener('resize', updateVh);
    window.addEventListener('resize', updateVh);
    updateVh();

    let tracks = [
      { id: 1, title: 'Between Two Cities', genre: 'Electronic', status: 'published' },
      { id: 2, title: 'Midnight Protocol', genre: 'Techno', status: 'draft' },
      { id: 3, title: 'Neon Drift', genre: 'Synthwave', status: 'published' },
      { id: 4, title: 'Acoustic Session #1', genre: 'Ambient', status: 'draft' },
      { id: 5, title: 'System Overload', genre: 'IDM', status: 'published' },
      { id: 6, title: 'Solar Echoes', genre: 'Downtempo', status: 'published' },
      { id: 7, title: 'Quantum Phase', genre: 'Techno', status: 'draft' }
    ];

    const trackList = document.getElementById('track-list');
    const currentFilterLabel = document.getElementById('current-filter-label');
    const trackCountDisplay = document.getElementById('track-count');
    let activeFilter = 'all';

    function renderTracks() {
      const filtered = tracks.filter(t => activeFilter === 'all' || t.status === activeFilter);
      trackList.innerHTML = '';
      
      filtered.forEach((track, index) => {
        const row = document.createElement('div');
        row.className = 'track-row neomorph-raised rounded-[18px] p-2 flex items-center gap-3 group transition-all duration-300 relative';
        row.dataset.id = track.id;
        row.addEventListener('contextmenu', e => e.preventDefault());

        row.innerHTML = `
          <div class="flex items-center justify-center w-4 shrink-0">
            <span class="status-indicator !mr-0 ${track.status === 'published' ? 'status-published' : 'status-draft'}" title="${track.status}" aria-label="${track.status}"></span>
          </div>
          <div class="flex-1 min-w-0 pointer-events-none flex flex-col justify-center ml-1">
            <h3 class="text-[16px] font-semibold truncate leading-none tracking-tight text-[var(--ink)]">${track.title}</h3>
            <p class="text-[12px] text-[var(--muted)] mt-1.5 leading-none">${track.genre} · DJey</p>
          </div>
          <div class="h-[44px] flex items-center shrink-0 pointer-events-auto relative z-10">
            <button id="edit-btn-${track.id}" class="h-[38px] px-5 neomorph-button rounded-[14px] flex items-center justify-center">
              <span class="text-[12px] font-bold uppercase tracking-wide">Edit</span>
            </button>
          </div>
        `;

        trackList.appendChild(row);
      });

      trackCountDisplay.textContent = '48 TRACKS TOTAL';
    }

    // Reordering Logic via SortableJS
    const sortable = new Sortable(trackList, {
      animation: 180,
      delay: 350,
      delayOnTouchOnly: true,
      touchStartThreshold: 5,
      filter: 'button, .pointer-events-auto',
      preventOnFilter: false,
      forceFallback: true,
      fallbackOnBody: true,
      scroll: true,
      chosenClass: 'sortable-chosen',
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      fallbackClass: 'sortable-fallback',
      onStart: () => document.body.classList.add('sorting-active'),
      onUnchoose: () => document.body.classList.remove('sorting-active'),
      onEnd: function (evt) {
        document.body.classList.remove('sorting-active');
        if (evt.oldIndex === evt.newIndex) return;
        
        const itemEl = evt.item;
        const newIds = Array.from(trackList.querySelectorAll('.track-row')).map(el => parseInt(el.dataset.id));
        
        const filteredTracks = tracks.filter(t => activeFilter === 'all' || t.status === activeFilter);
        const orderedFiltered = newIds.map(id => filteredTracks.find(t => t.id === id)).filter(Boolean);

        if (activeFilter === 'all') {
          tracks = orderedFiltered;
        } else {
          let fIdx = 0;
          tracks = tracks.map(t => {
            if (t.status === activeFilter) {
              return orderedFiltered[fIdx++];
            }
            return t;
          }).filter(Boolean);
        }
        
        showToast();
      }
    });

    function showToast() {
      const toast = document.getElementById('toast-reorder');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1200);
    }

    // UI Interactions
    const setupPopover = (btnId, popId) => {
      const btn = document.getElementById(btnId);
      const pop = document.getElementById(popId);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        pop.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!pop.contains(e.target) && e.target !== btn) {
          pop.classList.remove('open');
        }
      });
    };

    setupPopover('btn-account', 'account-popover');
    setupPopover('btn-filter', 'filter-popover');

    document.querySelectorAll('.filter-option').forEach(opt => {
      opt.addEventListener('click', () => {
        activeFilter = opt.dataset.filter;
        currentFilterLabel.textContent = opt.textContent;
        document.getElementById('filter-popover').classList.remove('open');
        renderTracks();
      });
    });

    const themeBtn = document.getElementById('btn-theme-toggle');
    const rootContainer = document.getElementById('root-container');
    let isDark = false;
    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      rootContainer.classList.toggle('theme-dark-amber', isDark);
      themeBtn.innerHTML = isDark 
        ? '<iconify-icon icon="lucide:sun" class="text-xl"></iconify-icon>' 
        : '<iconify-icon icon="lucide:moon" class="text-xl"></iconify-icon>';
    });

    renderTracks();
  </script>
</body>
</html>
