<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DJey Music — mobile player v3</title>
  <style>
    :root{color-scheme:light;--page:#e8edf2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f8fafc,var(--page))}button{font:inherit}
    main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}.intro{text-align:center;margin-bottom:8px;color:#2a3649}.intro b{display:block;font-size:18px;letter-spacing:-.03em}.intro span{font-size:10px;color:#788396}
    .player{--shell:#e9ece5;--ink:#26372b;--muted:#596b5c;--outer:#c4c9c0;--hi:#fff;--accent:#38a85f;--accent2:#a9f573;--glow:rgba(67,190,101,.22);--screen1:#14231a;--screen2:#263c2d;--screenShadow:#0e1811;--lcd1:#b9caad;--lcd2:#dce7d0;--lcdInk:#1f3b25;--plaque:#e5e9e1;--control:#e2e6de;width:min(410px,100%);height:min(780px,calc(100vh - 62px));min-height:665px;padding:16px;border-radius:36px;background:var(--shell);color:var(--ink);box-shadow:18px 18px 38px rgba(138,148,160,.43),-18px -18px 38px #fff,inset 1px 1px 1px rgba(255,255,255,.8);display:grid;grid-template-rows:50px minmax(235px,1fr) 132px 29px 116px;gap:12px;overflow:hidden;transition:background .25s ease,color .25s ease}
    .player.white{--shell:#ebf0f6;--ink:#26344b;--muted:#61708a;--outer:#c4ccd7;--accent:#5d76ef;--accent2:#62dce8;--glow:rgba(87,127,241,.22);--screen1:#e5ebf2;--screen2:#f5f8fb;--screenShadow:#c3cbd5;--lcd1:#dce7e8;--lcd2:#eff6f5;--lcdInk:#24474f;--plaque:#e8edf4;--control:#e7ecf3}.player.amber{--shell:#211f1d;--ink:#f0e8dd;--muted:#b5a48f;--outer:#0e0d0c;--hi:#37322d;--accent:#e97922;--accent2:#ffc45e;--glow:rgba(246,123,31,.28);--screen1:#0c0a08;--screen2:#21140c;--screenShadow:#050403;--lcd1:#21140b;--lcd2:#332012;--lcdInk:#ffc064;--plaque:#28231f;--control:#191715;box-shadow:18px 18px 38px rgba(34,29,25,.45),-12px -12px 30px rgba(255,255,255,.44),inset 1px 1px 1px rgba(255,255,255,.06)}.player.playing{outline:3px solid color-mix(in srgb,var(--accent) 48%,transparent);outline-offset:3px}
    .plaque{height:50px;padding:6px 8px;border-radius:17px;display:grid;grid-template-columns:37px 1fr 37px;align-items:center;background:var(--plaque);box-shadow:6px 6px 13px var(--outer),-6px -6px 13px var(--hi),inset 1px 1px 1px rgba(255,255,255,.55)}.amber .plaque{box-shadow:6px 6px 13px #100e0d,-5px -5px 12px #35302b}.brand{text-align:center;line-height:1}.brand b{display:block;font-size:15px;letter-spacing:.2em;text-transform:uppercase}.brand i{font-style:normal;color:var(--accent)}
    .icon,.key{border:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);background:var(--shell);box-shadow:4px 4px 9px var(--outer),-4px -4px 9px var(--hi)}.amber .icon,.amber .key{box-shadow:4px 4px 9px #0f0d0c,-4px -4px 9px #35302b}.icon{width:32px;height:32px;border-radius:50%;font-size:12px}
    .visual-shell{min-height:0;padding:10px;border-radius:25px;background:var(--shell);box-shadow:8px 8px 17px var(--outer),-8px -8px 17px var(--hi)}.amber .visual-shell{box-shadow:8px 8px 17px #0f0d0c,-6px -6px 14px #35302b}.visual{height:100%;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 116%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 58%),linear-gradient(155deg,var(--screen1),var(--screen2));box-shadow:inset 9px 9px 19px var(--screenShadow),inset -4px -4px 11px color-mix(in srgb,var(--accent) 17%,transparent)}.white .visual{box-shadow:inset 8px 8px 17px var(--screenShadow),inset -7px -7px 15px rgba(255,255,255,.75)}canvas{position:absolute;inset:0;width:100%;height:100%}
    .freq-scale{position:absolute;z-index:2;left:21px;right:21px;bottom:12px;display:flex;justify-content:space-between;align-items:center;color:color-mix(in srgb,var(--accent2) 76%,#7c8994);font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
    .display{height:132px;padding:14px 15px 12px;border-radius:16px;background:linear-gradient(145deg,var(--lcd1),var(--lcd2));color:var(--lcdInk);box-shadow:0 0 19px var(--glow),inset 0 0 18px color-mix(in srgb,var(--accent) 8%,transparent),inset 5px 5px 11px color-mix(in srgb,var(--lcd1) 76%,#7d8983),inset -5px -5px 11px color-mix(in srgb,var(--lcd2) 80%,#fff);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}.amber .display{box-shadow:0 0 21px var(--glow),inset 0 0 20px rgba(239,121,34,.08),inset 6px 6px 13px #090503,inset -4px -4px 10px #482c17;border-color:#6d3b19}.display-head{display:flex;justify-content:space-between;font-size:9px;font-weight:850;letter-spacing:.08em;opacity:.86}.status{display:flex;align-items:center;gap:5px}.status i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}.track{margin-top:8px;font-size:19px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:10px;margin-top:2px;opacity:.8}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--lcdInk) 18%,transparent);font-size:8px;opacity:.88}.details div:nth-child(2){text-align:center}.details div:last-child{text-align:right}.details b{display:block;margin-top:2px;font-size:9px}.codec{display:flex;justify-content:space-between;margin-top:7px;font-size:8px;font-weight:700;opacity:.7}
    .timeline{align-self:center;width:100%;padding:0 2px}.bar{height:8px;border-radius:10px;background:color-mix(in srgb,var(--outer) 58%,var(--shell));box-shadow:inset 2px 2px 4px var(--outer),inset -2px -2px 4px var(--hi);overflow:hidden}.amber .bar{box-shadow:inset 2px 2px 5px #0d0b0a,inset -2px -2px 4px #37312c}.bar i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent))}.times{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;font-weight:800;color:var(--muted)}
    .controls-wrap{display:flex;align-items:center;justify-content:center}.controls-panel{width:max-content;min-width:246px;padding:9px 15px 8px;border-radius:28px;background:var(--control);box-shadow:7px 7px 15px var(--outer),-7px -7px 15px var(--hi),inset 1px 1px 1px rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.amber .controls-panel{box-shadow:7px 7px 15px #0e0c0b,-6px -6px 14px #352f2a}.controls{display:flex;align-items:center;gap:18px}.key{width:43px;height:43px;border-radius:50%;font-size:13px}.play{width:59px;height:59px;color:#fff;font-size:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 72%,#fff),var(--accent));box-shadow:7px 7px 15px var(--outer),-7px -7px 15px var(--hi),inset 1px 1px 1px rgba(255,255,255,.55)}.amber .play{color:#2c1605;box-shadow:7px 7px 15px #0d0b09,-6px -6px 14px #3a332d}
    .swatches{display:flex;align-items:center;justify-content:center;gap:13px}.swatch{width:19px;height:19px;border:2px solid rgba(255,255,255,.66);border-radius:50%;cursor:pointer;box-shadow:3px 3px 7px var(--outer),-3px -3px 7px var(--hi)}.amber .swatch{box-shadow:3px 3px 7px #0d0b09,-3px -3px 7px #3a332d}.swatch[data-theme=white]{background:linear-gradient(135deg,#ecf4f8,#6479ed)}.swatch[data-theme=green]{background:linear-gradient(135deg,#dce7d0,#3bad62)}.swatch[data-theme=amber]{background:linear-gradient(135deg,#1b1714,#ef8028)}.swatch.selected{outline:2px solid var(--accent);outline-offset:2px}
    @media(max-width:600px){html,body{height:100%;overflow:hidden}main{height:100dvh;min-height:100svh;padding:0;display:block}.intro{display:none}.player{width:100%;height:100dvh;min-height:100svh;border-radius:0;box-shadow:none;padding:calc(12px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));grid-template-rows:50px minmax(225px,1fr) 132px 29px 116px;gap:12px}.player.amber{box-shadow:none}}
    @media(max-height:720px) and (max-width:600px){.player{grid-template-rows:48px minmax(190px,1fr) 124px 27px 106px;gap:9px;padding-top:calc(9px + env(safe-area-inset-top))}.display{height:124px;padding-top:11px}.track{font-size:17px}.details{margin-top:7px;padding-top:6px}.codec{margin-top:5px}.controls-panel{padding:7px 13px 6px}.key{width:38px;height:38px}.play{width:52px;height:52px}.swatch{width:17px;height:17px}}
    @media(prefers-reduced-motion:reduce){.player{transition:none}}
  </style>
</head>
<body>
<main>
  <div class="intro"><b>Mobile-first full player</b><span>Мобильная версия занимает всю высоту экрана.</span></div>
  <section class="player" id="player">
    <div class="plaque"><button class="icon" aria-label="Открыть очередь">☰</button><div class="brand"><b>DJey <i>Music</i></b></div><button class="icon" aria-label="Избранное">♡</button></div>
    <div class="visual-shell"><div class="visual"><canvas id="canvas"></canvas><div class="freq-scale"><span>20</span><span>60</span><span>250</span><span>1K</span><span>4K</span><span>16K</span></div></div></div>
    <div class="display"><div class="display-head"><span class="status"><i></i><span id="state">READY</span></span><span>TRACK 03 / 18</span></div><div class="track">Between Two Cities</div><div class="artist">DJey & Friend</div><div class="details"><div>FORMAT<b>MP3 · 320</b></div><div>GENRE<b>ELECTRONIC</b></div><div>YEAR<b>2026</b></div></div><div class="codec"><span>STEREO · 44.1 KHZ</span><span>ORIGINAL MASTER</span></div></div>
    <div class="timeline"><div class="bar"><i id="progress"></i></div><div class="times"><span id="time">0:00</span><span>0:16</span></div></div>
    <div class="controls-wrap"><div class="controls-panel"><div class="controls"><button class="key">◀</button><button class="key play" data-choice="play-mobile-v2" id="play" onclick="togglePlay()">▶</button><button class="key">▶</button></div><div class="swatches"><button class="swatch" data-theme="white" aria-label="White Neon" onclick="setTheme('white')"></button><button class="swatch selected" data-theme="green" aria-label="Green Receiver" onclick="setTheme('green')"></button><button class="swatch" data-theme="amber" aria-label="Dark Amber" onclick="setTheme('amber')"></button></div></div></div>
  </section>
</main>
<script>
  const D=16;let current='green',ac,buf,src,an,gain,playing=false,offset=0,started=0;const player=document.querySelector('#player'),canvas=document.querySelector('#canvas'),play=document.querySelector('#play');
  function setTheme(t){current=t;player.classList.remove('white','amber');if(t!=='green')player.classList.add(t);document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x.dataset.theme===t));try{localStorage.setItem('jmusic-demo-theme',t)}catch(e){}}
  const hz=n=>440*Math.pow(2,(n-69)/12),noise=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return(x-Math.floor(x))*2-1};
  function music(c){const sr=c.sampleRate,n=D*sr|0,b=c.createBuffer(2,n,sr),ch=[[48,55,60,64],[43,50,55,59],[45,52,57,60],[41,48,53,57]],bs=[36,31,33,29],m=[72,74,76,79,76,74,72,67,69,72,76,74,72,69,67,64];for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++){const t=i/sr,bar=Math.floor(t/4)%4,s=Math.floor(t*4)%m.length;let v=0;for(const q of ch[bar]){const f=hz(q);v+=Math.sin(2*Math.PI*f*t+k*.08)*.026+Math.sin(4*Math.PI*f*t)*.008}v+=Math.sin(2*Math.PI*hz(bs[bar])*t)*.12;const p=t%.25,e=Math.min(1,p/.015,Math.max(0,(.23-p)/.12));v+=(Math.sin(2*Math.PI*hz(m[s])*t)+.25*Math.sin(4*Math.PI*hz(m[s])*t))*e*.052;const z=t%.5;if(z<.16)v+=Math.sin(2*Math.PI*(92-260*z)*z)*Math.exp(-z*25)*.34;if(p<.055)v+=noise(i+k*91)*Math.exp(-p*65)*.045;d[i]=Math.tanh(v*1.25)*.68}}return b}
  async function ready(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();buf=music(ac);gain=ac.createGain();gain.gain.value=.72;gain.connect(ac.destination)}if(ac.state==='suspended')await ac.resume()}
  function stop(){if(src){try{src.stop()}catch(e){}src.disconnect();src=null}if(playing)offset=(offset+ac.currentTime-started)%D;playing=false;player.classList.remove('playing');play.textContent='▶';document.querySelector('#state').textContent='PAUSED'}
  async function togglePlay(){await ready();if(playing){stop();return}an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.84;src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.connect(an);an.connect(gain);started=ac.currentTime;src.start(0,offset);playing=true;player.classList.add('playing');play.textContent='Ⅱ';document.querySelector('#state').textContent='PLAYING'}
  function fit(){const d=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d}return{g:canvas.getContext('2d'),w:canvas.width,h:canvas.height}}
  function frame(){const f=new Uint8Array(256);if(playing&&an)an.getByteFrequencyData(f);const{g,w,h}=fit(),count=38,side=w*.035,available=w-side*2,gap=available*.006,bw=(available-gap*(count-1))/count,now=performance.now();g.clearRect(0,0,w,h);for(let i=0;i<count;i++){const v=playing?f[Math.floor(2+Math.pow(i/count,.72)*145)]/255:.07+.04*Math.sin(now*.0017+i*.55),bh=Math.max(h*.025,h*(.08+v*.7)),x=side+i*(bw+gap),y=h*.82-bh,gr=g.createLinearGradient(0,y,0,y+bh);if(current==='amber'){gr.addColorStop(0,'#ffd36b');gr.addColorStop(.52,'#f79435');gr.addColorStop(1,'#b94d15');g.shadowColor='rgba(255,143,48,.5)'}else if(current==='green'){gr.addColorStop(0,'#b2ff79');gr.addColorStop(.52,'#55dc78');gr.addColorStop(1,'#258d50');g.shadowColor='rgba(104,255,139,.48)'}else{gr.addColorStop(0,'#66dce7');gr.addColorStop(.52,'#6380f1');gr.addColorStop(1,'#4d60bf');g.shadowColor='transparent'}g.shadowBlur=playing&&current!=='white'?8:0;g.fillStyle=gr;g.beginPath();g.roundRect(x,y,bw,bh,bw/2);g.fill();g.shadowBlur=0}if(playing){const t=(offset+ac.currentTime-started)%D;document.querySelector('#progress').style.width=t/D*100+'%';document.querySelector('#time').textContent='0:'+String(Math.floor(t)).padStart(2,'0')}requestAnimationFrame(frame)}
  try{setTheme(localStorage.getItem('jmusic-demo-theme')||'green')}catch(e){setTheme('green')}frame();
</script>
</body>
</html>
